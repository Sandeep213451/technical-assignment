services:
  app:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-my_user}
      - DB_PASSWORD=${DB_PASSWORD:-my_password}
      - DB_DATABASE=${DB_DATABASE:-my_database}
      - REDIS_HOST=redis
    volumes:
      - './backend:/app'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_USER=${DB_USERNAME:-my_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-my_password}
      - MYSQL_DATABASE=${DB_DATABASE:-my_database}
    volumes:
      - 'mysql_data:/var/lib/mysql'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u${DB_USERNAME:-my_user}", "-p${DB_PASSWORD:-my_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    ports:
      - '8080:8080'
    volumes:
      - './frontend:/app'
      - './frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro'

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
